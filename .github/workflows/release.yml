name: Build macOS DMG

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to build and publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish DMG
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Validate release tag
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9][0-9A-Za-z._-]*$ ]]; then
              echo "Release tag must be a safe v-prefixed version" >&2
              exit 1
          fi
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          xcodebuild -version

      - name: Configure runner paths
        run: |
          version="${RELEASE_TAG#v}"
          {
              echo "DERIVED_DATA_PATH=$RUNNER_TEMP/IceDerivedData"
              echo "SOURCE_PACKAGES_PATH=$RUNNER_TEMP/IceSourcePackages"
              echo "APP_PATH=$RUNNER_TEMP/IceDerivedData/Build/Products/Release/Ice.app"
              echo "DIST_DIR=$RUNNER_TEMP/IceDistribution"
              echo "DMG_PATH=$RUNNER_TEMP/IceDistribution/Ice-$version-arm64.dmg"
          } >> "$GITHUB_ENV"

      - name: Build and test Release app
        run: |
          set -euo pipefail

          ICE_SIGNING_MODE=adhoc \
          ICE_BUILD_ARCHS=arm64 \
          CONFIGURATION=Release \
          DERIVED_DATA_PATH="$DERIVED_DATA_PATH" \
          SOURCE_PACKAGES_PATH="$SOURCE_PACKAGES_PATH" \
          ./Scripts/smoke-test-xpc.sh

          app_version="$(
              /usr/libexec/PlistBuddy \
                  -c 'Print :CFBundleShortVersionString' \
                  "$APP_PATH/Contents/Info.plist"
          )"
          if [[ "$RELEASE_TAG" != "v$app_version" ]]; then
              echo "Tag $RELEASE_TAG does not match app version v$app_version" >&2
              exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Package DMG
        run: |
          set -euo pipefail

          APP_PATH="$APP_PATH" \
          OUTPUT_PATH="$DMG_PATH" \
          RELEASE_TAG="$RELEASE_TAG" \
          ./Scripts/package-release-dmg.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Ice-${{ env.RELEASE_TAG }}
          path: |
            ${{ runner.temp }}/IceDistribution/*.dmg
            ${{ runner.temp }}/IceDistribution/*.dmg.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          notes_path="$RUNNER_TEMP/release-notes.md"
          printf '%s\n\n%s\n' \
              'Apple silicon DMG. Drag Ice.app to Applications.' \
              'This automated build is ad-hoc signed and is not notarized by Apple. macOS may require explicit approval in System Settings > Privacy & Security after installing or updating.' \
              > "$notes_path"

          release_flags=(--prerelease=false)
          if [[ "$RELEASE_TAG" == *-preview.* ]]; then
              release_flags=(--prerelease --latest=false)
              version_notes="docs/releases/${RELEASE_TAG#v}.md"
              if [[ -f "$version_notes" ]]; then
                  printf '\n' >> "$notes_path"
                  cat "$version_notes" >> "$notes_path"
              else
                  printf '\n%s\n\n%s\n\n%s\n\n%s\n' \
                  'macOS 27 compatibility preview: opt-in app hiding/reveal, system-item visibility settings (including grouped Time Machine / Siri), and settings layout fixes.' \
                  'Known limitations: hiding can also conceal additional system controls and prevent the clock from opening Notification Center. Reveal all sections, disable experimental hiding, or quit Ice to restore normal behavior.' \
                  'Ice Bar, divider dragging, and several legacy reveal modes are unavailable on macOS 27. macOS 14-26 continue to use the legacy backend.' \
                  "Details: https://github.com/$GITHUB_REPOSITORY/blob/$RELEASE_TAG/docs/MACOS-27.md" \
                  >> "$notes_path"
              fi
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              gh release upload "$RELEASE_TAG" \
                  "$DMG_PATH#Ice for Apple silicon (ad-hoc signed)" \
                  "$DMG_PATH.sha256#SHA-256 checksum" \
                  --clobber
              gh release edit "$RELEASE_TAG" \
                  --notes-file "$notes_path" \
                  --title "Ice $RELEASE_TAG" \
                  "${release_flags[@]}"
          else
              gh release create "$RELEASE_TAG" \
                  "$DMG_PATH#Ice for Apple silicon (ad-hoc signed)" \
                  "$DMG_PATH.sha256#SHA-256 checksum" \
                  --verify-tag \
                  --notes-file "$notes_path" \
                  --title "Ice $RELEASE_TAG" \
                  "${release_flags[@]}"
          fi
